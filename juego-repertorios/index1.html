<!DOCTYPE html>
<html lang="es">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VL13MMLPRV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VL13MMLPRV');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Reserva de Repertorios</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { 
            background-color: #f4f4f9; margin: 0; padding: 10px; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; touch-action: manipulation;
        }

        #juego-contenedor { 
            width: 100%; max-width: 550px; 
            display: flex; flex-direction: column; 
            background: white; padding: 15px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        
        #panel-superior { flex-shrink: 0; text-align: center; }
        
        #controles { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; }
        button { padding: 10px 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        #btn-comenzar { background-color: #2ecc71; color: white; }
        #btn-pausa { background-color: #f39c12; color: white; }
        #btn-comenzar:disabled, #btn-pausa:disabled { background-color: #bdc3c7; cursor: not-allowed; transform: none; }
        
        #album-premios { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .circulo-premio { width: 45px; height: 45px; border-radius: 50%; background-color: #ecf0f1; border: 2px dashed #bdc3c7; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .circulo-premio img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .circulo-premio.desbloqueado { border: 2px solid #f1c40f; background-color: white; }
        .circulo-premio.desbloqueado img { display: block; }

        #panel-info { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; padding: 0 5px; margin-bottom: 5px; color: #34495e; }
        #contenedor-barra { width: 100%; height: 18px; background-color: #ecf0f1; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        #barra-progreso { width: 0%; height: 100%; background-color: #27ae60; transition: width 0.3s ease; }

        #objetivo-pantalla { font-size: 3rem; font-weight: bold; color: #2c3e50; height: 55px; margin-bottom: 10px; }

        /* --- EL ÁREA DE JUEGO --- */
        #area-caida { 
            width: 100%; background-color: #e0f7fa; 
            position: relative; overflow: hidden; 
            border: 3px solid #009688; border-radius: 10px; 
            box-sizing: border-box;
        }

        #personaje { 
            width: 70px; height: 85px; 
            position: absolute; bottom: 0; left: 0; 
            background-image: url('carpincho_jugador.png'); 
            background-size: contain; background-repeat: no-repeat; background-position: center bottom;
            z-index: 5;
        }

        .bloque { 
            width: 28%; padding: 15px 0; 
            background-color: #27ae60; color: white; 
            font-size: 1.1rem; font-weight: bold; 
            position: absolute; border-radius: 8px; 
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        }

        /* --- CARTEL MENSAJES --- */
        #cartel-mensaje { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; text-align: center; border-radius: 8px;}
        #cartel-mensaje h2 { font-size: 2.2rem; margin-bottom: 10px; color: #2c3e50; }
        #cartel-mensaje p { font-size: 1.2rem; color: #7f8c8d; }
        #cartel-mensaje img { max-width: 160px; margin: 15px 0; border-radius: 10px; }

        /* --- BOTONES TOUCH GLOBALES --- */
        #controles-touch { display: flex; justify-content: center; gap: 20px; padding-top: 15px; flex-shrink: 0; }
        .btn-t { width: 65px; height: 65px; font-size: 2rem; background-color: #34495e; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; user-select: none; box-shadow: 0 4px 0 #2c3e50; }
        .btn-t:active { transform: translateY(4px); box-shadow: none; }

        /* =========================================
           REGLAS SEGÚN EL DISPOSITIVO 
           ========================================= */
        @media (min-width: 601px) {
            #controles-touch { display: none !important; } 
            #area-caida { height: 450px; } 
        }

        @media (max-width: 600px) {
            body { padding: 5px; justify-content: flex-start; }
            #juego-contenedor { height: 98vh; padding: 10px; border-radius: 10px; }
            #area-caida { flex-grow: 1; height: auto; } 
            #objetivo-pantalla { font-size: 2.5rem; height: 45px; }
            .bloque { padding: 10px 0; font-size: 1rem; }
            #personaje { width: 60px; height: 75px; }
            .btn-t { width: 55px; height: 55px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>



    <div id="juego-contenedor">
        <div id="panel-superior">
            <div id="controles">
                <button id="btn-comenzar">▶ Comenzar</button>
                <button id="btn-pausa" disabled>⏸ Pausa</button>
            </div>

            <div id="album-premios">
                <div class="circulo-premio" id="p-1"><img src="tucan.png"></div>
                <div class="circulo-premio" id="p-2"><img src="oso.png"></div>
                <div class="circulo-premio" id="p-3"><img src="yaguarete.png"></div>
                <div class="circulo-premio" id="p-4"><img src="carpincho.png"></div>
            </div>

            <div id="panel-info">
                <span>Nivel: <span id="nivel-texto">1</span></span>
                <span>Oportunidades: <span id="vidas">3</span></span>
            </div>

            <div id="contenedor-barra"><div id="barra-progreso"></div></div>
            <div id="objetivo-pantalla">¿Listo?</div>
        </div>

        <div id="area-caida">
            <div id="personaje"></div> 
            <div id="cartel-mensaje">
                <h2 id="titulo-msg">¡Buen esfuerzo!</h2>
                <p id="cuerpo-msg"></p>
                <img id="img-premio" src="">
                <button id="btn-accion-msg" style="background-color: #2ecc71; color: white;" onclick="cerrarCartel()">Seguir</button>
            </div>
        </div>

        <div id="controles-touch">
            <div class="btn-t" id="btn-izq">⬅️</div>
            <div class="btn-t" id="btn-abajo">⬇️</div>
            <div class="btn-t" id="btn-der">➡️</div>
        </div>
    </div>

    <script>
                // --- ANCLAJES DE SONIDO ---
        function tocarSonido(tipo) {
            let audio;
            
            // ATENCIÓN: Cambiá '.wav' por '.mp3' si tus archivos tienen ese formato
            // Y asegurate de que los nombres coincidan exactamente con tus archivos
            
            if(tipo === 'acierto') audio = new Audio('acierto.mp3');
            if(tipo === 'error') audio = new Audio('error.mp3');
            if(tipo === 'nivel') audio = new Audio('nivel.mp3');
            if(tipo === 'final') audio = new Audio('final.mp3');
            
            if(audio) {
                // Le bajamos un poquito el volumen general para que sea suave (0.5 es la mitad)
                audio.volume = 0.5; 
                audio.play();
            }
        }
        

        // --- BANCO MATEMÁTICO ---
        const bancoOperaciones = {
            1: [
                { obj: "40", op: ["4 x 10", "4 x 100", "40 x 10"], cor: "4 x 10" },
                { obj: "120", op: ["3 x 40", "30 x 40", "3 x 400"], cor: "3 x 40" },
                { obj: "350", op: ["7 x 50", "70 x 50", "7 x 5"], cor: "7 x 50" },
                { obj: "600", op: ["60 x 10", "60 x 100", "6 x 10"], cor: "60 x 10" },
                { obj: "90", op: ["9 x 10", "9 x 100", "90 x 100"], cor: "9 x 10" },
                { obj: "150", op: ["5 x 30", "50 x 30", "5 x 300"], cor: "5 x 30" },
                { obj: "240", op: ["8 x 30", "8 x 300", "80 x 30"], cor: "8 x 30" },
                { obj: "420", op: ["6 x 70", "60 x 70", "6 x 700"], cor: "6 x 70" },
                { obj: "810", op: ["9 x 90", "9 x 900", "90 x 90"], cor: "9 x 90" },
                { obj: "200", op: ["4 x 50", "40 x 50", "4 x 5"], cor: "4 x 50" },
                { obj: "280", op: ["7 x 40", "7 x 400", "70 x 40"], cor: "7 x 40" },
                { obj: "360", op: ["6 x 60", "6 x 600", "60 x 60"], cor: "6 x 60" },
                { obj: "540", op: ["9 x 60", "9 x 600", "90 x 60"], cor: "9 x 60" },
                { obj: "320", op: ["8 x 40", "8 x 400", "80 x 40"], cor: "8 x 40" },
                { obj: "480", op: ["6 x 80", "6 x 800", "60 x 80"], cor: "6 x 80" }
            ],
            2: [
                { obj: "400", op: ["4 x 100", "40 x 100", "4 x 10"], cor: "4 x 100" },
                { obj: "1.500", op: ["3 x 500", "3 x 50", "30 x 500"], cor: "3 x 500" },
                { obj: "2.400", op: ["6 x 400", "60 x 400", "6 x 40"], cor: "6 x 400" },
                { obj: "800", op: ["8 x 100", "8 x 10", "80 x 100"], cor: "8 x 100" },
                { obj: "3.500", op: ["7 x 500", "7 x 50", "70 x 500"], cor: "7 x 500" },
                { obj: "1.200", op: ["4 x 300", "4 x 30", "40 x 300"], cor: "4 x 300" },
                { obj: "1.800", op: ["9 x 200", "9 x 20", "90 x 200"], cor: "9 x 200" },
                { obj: "4.200", op: ["6 x 700", "60 x 700", "6 x 70"], cor: "6 x 700" },
                { obj: "5.400", op: ["9 x 600", "9 x 60", "90 x 600"], cor: "9 x 600" },
                { obj: "2.700", op: ["3 x 900", "30 x 900", "3 x 90"], cor: "3 x 900" },
                { obj: "1.600", op: ["8 x 200", "8 x 20", "80 x 200"], cor: "8 x 200" },
                { obj: "6.400", op: ["8 x 800", "8 x 80", "80 x 800"], cor: "8 x 800" },
                { obj: "4.500", op: ["5 x 900", "5 x 90", "50 x 900"], cor: "5 x 900" },
                { obj: "2.100", op: ["7 x 300", "7 x 30", "70 x 300"], cor: "7 x 300" },
                { obj: "4.900", op: ["7 x 700", "7 x 70", "70 x 700"], cor: "7 x 700" }
            ],
            3: [
                { obj: "4.000", op: ["4 x 1.000", "4 x 100", "40 x 1.000"], cor: "4 x 1.000" },
                { obj: "12.000", op: ["3 x 4.000", "3 x 400", "30 x 4.000"], cor: "3 x 4.000" },
                { obj: "35.000", op: ["7 x 5.000", "7 x 500", "70 x 5.000"], cor: "7 x 5.000" },
                { obj: "8.000", op: ["8 x 1.000", "8 x 100", "80 x 1.000"], cor: "8 x 1.000" },
                { obj: "24.000", op: ["6 x 4.000", "6 x 400", "60 x 4.000"], cor: "6 x 4.000" },
                { obj: "15.000", op: ["5 x 3.000", "5 x 300", "50 x 3.000"], cor: "5 x 3.000" },
                { obj: "18.000", op: ["9 x 2.000", "9 x 200", "90 x 2.000"], cor: "9 x 2.000" },
                { obj: "42.000", op: ["6 x 7.000", "6 x 700", "60 x 7.000"], cor: "6 x 7.000" },
                { obj: "54.000", op: ["9 x 6.000", "9 x 600", "90 x 6.000"], cor: "9 x 6.000" },
                { obj: "27.000", op: ["3 x 9.000", "3 x 900", "30 x 9.000"], cor: "3 x 9.000" },
                { obj: "16.000", op: ["8 x 2.000", "8 x 200", "80 x 2.000"], cor: "8 x 2.000" },
                { obj: "64.000", op: ["8 x 8.000", "8 x 800", "80 x 8.000"], cor: "8 x 8.000" },
                { obj: "45.000", op: ["5 x 9.000", "5 x 900", "50 x 9.000"], cor: "5 x 9.000" },
                { obj: "21.000", op: ["7 x 3.000", "7 x 300", "70 x 3.000"], cor: "7 x 3.000" },
                { obj: "49.000", op: ["7 x 7.000", "7 x 700", "70 x 7.000"], cor: "7 x 7.000" }
            ]
        };

        const premios = { 1: "tucan.png", 2: "oso.png", 3: "yaguarete.png", 4: "carpincho.png" };
        
        // --- VARIABLES DE ESTADO ---
        let nivelActual = 1, aciertosNivel = 0, aciertosNecesarios = 6;
        let enJuego = false, enPausa = false, velocidadCaida = 2;
        let objetivoActual = "", intervaloCaida, posicionX = 0;
        let bloquesActivos = [];
        let rondaActiva = false; // ¡EL CANDADO NUEVO!

        // Inicializar Posición
        window.onload = () => {
            let area = document.getElementById('area-caida');
            posicionX = (area.clientWidth / 2) - 35; 
            document.getElementById('personaje').style.left = posicionX + 'px';
        };

        function mezclar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- MOTOR DEL JUEGO ---
       function lanzarRonda() {
            if (!enJuego || enPausa) return;
            
            // --- NUEVA VELOCIDAD INTELIGENTE ---
            // Si la pantalla es chica (celular), velocidad 1.2. Si es grande (PC), velocidad 2.
            velocidadCaida = (window.innerWidth <= 600) ? 1.2 : 2; 
            
            rondaActiva = true; // Abrimos el candado para esta ronda
            // ... sigue el código ...

            if (aciertosNivel >= aciertosNecesarios) {
                mostrarPremioNivel();
                return;
            }

            let banco = (nivelActual === 4) ? [...bancoOperaciones[1], ...bancoOperaciones[2], ...bancoOperaciones[3]] : bancoOperaciones[nivelActual];
            let item = banco[Math.floor(Math.random() * banco.length)];
            objetivoActual = item.obj;
            document.getElementById('objetivo-pantalla').innerText = objetivoActual;

            let area = document.getElementById('area-caida');
            let ancho = area.clientWidth;
            let opciones = mezclar([...item.op]);
            let columnas = mezclar([ancho * 0.02, ancho * 0.35, ancho * 0.68]);
            
            bloquesActivos = [];
            for (let i = 0; i < 3; i++) {
                const b = document.createElement('div');
                b.className = 'bloque';
                b.innerText = opciones[i];
                b.style.left = columnas[i] + 'px';
                b.style.top = '-80px';
                b.dataset.cor = (opciones[i] === item.cor);
                b.dataset.posY = -80;
                area.appendChild(b);
                bloquesActivos.push(b);
            }

            intervaloCaida = setInterval(() => {
                if (enPausa || !rondaActiva) return; // Si el candado se cerró, ignora todo
                
                let areaAlto = area.clientHeight;
                let anchoBloque = ancho * 0.28; 
                
                // Usamos un for tradicional para poder frenar en seco con "break"
                for (let i = 0; i < bloquesActivos.length; i++) {
                    let b = bloquesActivos[i];
                    let y = parseFloat(b.dataset.posY) + velocidadCaida;
                    b.dataset.posY = y;
                    b.style.top = y + 'px';

                    let bX = parseFloat(b.style.left);
                    
                    // Colisión con el carpincho
                    if (y > (areaAlto - 90) && y < (areaAlto - 30)) {
                        if (posicionX + 60 > bX && posicionX < bX + anchoBloque) {
                            rondaActiva = false; // ¡CERRAMOS EL CANDADO INMEDIATAMENTE!
                            detenerRonda();
                            
                            if (b.dataset.cor === "true") {
                                aciertosNivel++;
                                tocarSonido('acierto');
                                actualizarBarra();
                                feedback('#c8e6c9'); 
                            } else {
                                restarVida();
                                tocarSonido('error');
                                feedback('#ffcdd2'); 
                            }
                            limpiarRonda();
                            break; // Frena el chequeo de las otras tarjetas
                        }
                    }
                    
                    // Colisión con el piso
                    if (y > areaAlto) { 
                        rondaActiva = false; // ¡CERRAMOS EL CANDADO INMEDIATAMENTE!
                        detenerRonda();
                        restarVida(); 
                        tocarSonido('error');
                        feedback('#ffcdd2');
                        limpiarRonda(); 
                        break; // Frena el chequeo de las otras tarjetas
                    }
                }
            }, 30);
        }

        function detenerRonda() {
            clearInterval(intervaloCaida);
            frenarMovimientoTouch(); 
        }

        function limpiarRonda() {
            bloquesActivos.forEach(b => b.remove());
            if (enJuego) setTimeout(lanzarRonda, 800);
        }

        function actualizarBarra() {
            document.getElementById('barra-progreso').style.width = (aciertosNivel / aciertosNecesarios * 100) + '%';
        }

        function feedback(color) {
            const area = document.getElementById('area-caida');
            area.style.backgroundColor = color;
            setTimeout(() => area.style.backgroundColor = '#e0f7fa', 300);
        }

        function restarVida() {
            let v = parseInt(document.getElementById('vidas').innerText) - 1;
            document.getElementById('vidas').innerText = v;
            if (v <= 0) {
                enJuego = false;
                mostrarCartel("¡Buen esfuerzo!", "Podés seguir practicando para conocer a todos los animales.", "", "Intentar de nuevo");
            }
        }

        function mostrarPremioNivel() {
            const animal = (nivelActual === 1) ? "Tucán" : (nivelActual === 2) ? "Oso Hormiguero" : (nivelActual === 3) ? "Yaguareté" : "Carpincho";
            document.getElementById(`p-${nivelActual}`).classList.add('desbloqueado');
            
            if (nivelActual < 4) {
                tocarSonido('nivel');
                mostrarCartel(`¡Nivel ${nivelActual} Superado!`, `Descubriste al ${animal}.`, premios[nivelActual], "Ir al Nivel " + (nivelActual + 1));
            } else {
                enJuego = false; 
                tocarSonido('final');
                mostrarCartel("¡Reserva Completa!", "¡Felicitaciones! Lograste reunir a todos los animales nativos.", "final_reserva.png", "Jugar de nuevo");
            }
        }

        function mostrarCartel(tit, cuerpo, img, btn) {
            enPausa = true;
            const c = document.getElementById('cartel-mensaje');
            document.getElementById('titulo-msg').innerText = tit;
            document.getElementById('cuerpo-msg').innerText = cuerpo;
            document.getElementById('img-premio').src = img;
            document.getElementById('img-premio').style.display = img ? "block" : "none";
            document.getElementById('btn-accion-msg').innerText = btn;
            c.style.display = "flex";
        }

        function cerrarCartel() {
            document.getElementById('cartel-mensaje').style.display = "none";
            if (!enJuego) { 
                location.reload(); 
            } else {
                nivelActual++;
                aciertosNivel = 0;
                document.getElementById('nivel-texto').innerText = (nivelActual === 4) ? "Experto" : nivelActual;
                actualizarBarra();
                enPausa = false;
                lanzarRonda();
            }
        }

        // --- SISTEMA UNIFICADO DE MOVIMIENTO ---
        function actualizarPosicionX(cambio) {
            if (!enJuego || enPausa) return;
            let area = document.getElementById('area-caida');
            let anchoMaximo = area.clientWidth - 70; 
            
            posicionX += cambio;
            if (posicionX < 0) posicionX = 0;
            if (posicionX > anchoMaximo) posicionX = anchoMaximo;
            
            document.getElementById('personaje').style.left = posicionX + 'px';
        }

        // --- CONTROLES TECLADO ---
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') actualizarPosicionX(35);
            if (e.key === 'ArrowLeft') actualizarPosicionX(-35);
            if (e.key === 'ArrowDown') velocidadCaida = 10;
        });
        document.addEventListener('keyup', e => { 
            if (e.key === 'ArrowDown') {
                velocidadCaida = (window.innerWidth <= 600) ? 1.2 : 2; 
            }
        });

        // --- CONTROLES TOUCH ---
        let intervaloTouch;
        function iniciarMovimientoTouch(dir) {
            if (!enJuego || enPausa) return;
            clearInterval(intervaloTouch);
            
            intervaloTouch = setInterval(() => {
                if (dir === 'izq') actualizarPosicionX(-20);
                if (dir === 'der') actualizarPosicionX(20);
                if (dir === 'abajo') velocidadCaida = 10;
            }, 50);
        }

        function frenarMovimientoTouch() {
            clearInterval(intervaloTouch);
            velocidadCaida = (window.innerWidth <= 600) ? 1.2 : 2;
        }

        const setupBtn = (id, dir) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarMovimientoTouch(dir); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); frenarMovimientoTouch(); });
            btn.addEventListener('touchcancel', (e) => { e.preventDefault(); frenarMovimientoTouch(); });
        };
        setupBtn('btn-izq', 'izq'); setupBtn('btn-der', 'der'); setupBtn('btn-abajo', 'abajo');

        // --- BOTONES DE MENÚ ---
        document.getElementById('btn-comenzar').addEventListener('click', function() {
            enJuego = true; this.disabled = true;
            document.getElementById('btn-pausa').disabled = false;
            lanzarRonda();
        });

        document.getElementById('btn-pausa').addEventListener('click', function() {
            if (!enJuego) return; 
            enPausa = !enPausa;
            this.innerText = enPausa ? "▶ Reanudar" : "⏸ Pausa";
            document.getElementById('objetivo-pantalla').innerText = enPausa ? "PAUSA" : objetivoActual;
        });
    </script>
<div id="contenedor-pie"></div>

<script>
  fetch('/pie.html')
    .then(response => {
      if (response.ok) return response.text();
      throw new Error('No se pudo cargar el pie de página');
    })
    .then(data => {
      document.getElementById('contenedor-pie').innerHTML = data;
    })
    .catch(error => console.error('Error:', error));
</script>
<script src="/volver.js" defer></script>
</body>
</html>
