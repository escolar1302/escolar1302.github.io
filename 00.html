<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel de Herramientas</title>

    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        /* Caja blanca principal */
        .contenedor {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 1.6rem;
        }

        /* Una columna: los botones van uno bajo el otro */
        .enlaces-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        /* Botones */
        .boton-enlace {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 12px 18px;
            color: white;
            text-decoration: none;
            font-size: 1.05rem;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
            text-align: center;
        }

        .boton-enlace:hover {
            transform: translateY(-2px);
        }

        /* Colores individuales */
        .btn-1 { 
            background-color: #27ae60; 
        }

        .btn-1:hover { 
            background-color: #2ecc71; 
        }

        .btn-2 { 
            background-color: #e67e22; 
        }

        .btn-2:hover { 
            background-color: #d35400; 
        }

        .btn-3 { 
            background-color: #2980b9; 
        }

        .btn-3:hover { 
            background-color: #3498db; 
        }

        /* En celular: una columna */
        @media (max-width: 700px) {
            body {
                padding: 20px 10px;
            }

            .contenedor {
                padding: 25px 18px;
            }

            .enlaces-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.35rem;
            }

            .boton-enlace {
                font-size: 1rem;
                min-height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>🛠️ Mis Accesos Directos</h1>

        <div class="enlaces-grid">
            <a href="constructor_lengua_choice.html" class="boton-enlace btn-1">📝 Hacer fichas choice lengua</a>

            <a href="cuestionario.html" class="boton-enlace btn-2">📝 Cuestionario</a>

            <a href="editor.html" class="boton-enlace btn-3">🚀 Editor del sitio</a>
        </div>
    </div>

</body>
</html>
