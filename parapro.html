<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Docente - Matemática Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f7;
            --panel-color: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --accent-math: #d31718;    /* Rojo */
            --accent-alt: #036fb0;     /* Azul */
            --accent-action: #e67e22;  /* Naranja */
            --accent-success: #27ae60; /* Verde */
        }

        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: background 0.3s; }
        .container { width: 100%; max-width: 1000px; margin-top: 20px; }
        
        header.docente-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent-math); padding-bottom: 10px; }
        header.docente-header h1 { color: var(--accent-math); margin: 0; }
        .subtitulo { color: #666; font-size: 0.9rem; }

        .zona-pegado, .zona-vistas { background-color: #ffffff; padding: 20px; border-radius: 8px; border: 2px dashed #aaaaaa; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .zona-vistas { display: none; border-style: solid; border-color: var(--accent-alt); text-align: center;}
        
        textarea { width: 100%; height: 120px; background-color: #fafafa; color: #333; border: 1px solid var(--border-color); border-radius: 5px; padding: 10px; font-family: monospace; box-sizing: border-box; margin-bottom: 15px; }
        
        .botones-vistas { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px;}
        .btn-generar, .btn-vista { color: white; border: none; padding: 10px; font-size: 0.9rem; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; transition: 0.2s; min-width: 110px; opacity: 0.85;}
        
        #btn-v-int { background-color: var(--accent-alt); }
        #btn-v-ren { background-color: var(--accent-action); }
        #btn-v-tex { background-color: var(--accent-success); }
        .btn-limpiar, .btn-reiniciar { background-color: var(--accent-math); opacity: 1; }
        .btn-copiar { background-color: #34495e; opacity: 1; }
        
        .btn-generar { background-color: var(--accent-alt); opacity: 1; width: 100%; max-width: 300px;}
        .btn-vista.activa { opacity: 1; box-shadow: 0 4px 0px rgba(0,0,0,0.2); transform: translateY(-2px);}
        .btn-vista:hover, .btn-generar:hover { opacity: 1; filter: brightness(1.1); }
        
        .btn-imprimir { background-color: #2c3e50; opacity: 1; }
        .btn-exportar { background-color: var(--accent-action); opacity: 1; }
        
        .input-titulo { padding: 10px; border-radius: 5px; border: 2px solid #ccc; font-weight: bold; font-size: 1rem; width: 100%; max-width: 250px; text-align: center; }

        #bateria-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%; }
        
        @media (max-width: 768px) { 
            #bateria-container { grid-template-columns: 1fr; } 
        }

        .problema-card { background-color: var(--panel-color); border-top: 5px solid var(--accent-math); border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative;}
        .print-selector { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: #666; background: #f4f6f7; padding: 4px 8px; border-radius: 4px; border: 1px solid #ddd; cursor: pointer;}
        .titulo-problema { color: var(--accent-math); font-size: 1.3rem; margin: 0 0 15px 0; padding-right: 80px;} 
        .enunciado { line-height: 1.5; font-size: 1.1rem; margin-bottom: 20px; flex-grow: 1; }
        .opciones-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .opcion-btn { background: #f9f9f9; border: 2px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 5px; cursor: pointer; text-align: center; font-weight: bold; transition: 0.2s;}
        .opcion-btn.selected { background: var(--accent-alt); color: white; border-color: var(--accent-alt); }
        .respuesta-input { width: 100%; padding: 12px; background: #ffffff; border: 2px solid var(--border-color); color: #333; font-size: 1rem; margin-bottom: 15px; box-sizing: border-box; border-radius: 5px; }
        .feedback-msg { text-align: center; font-weight: bold; margin-bottom: 10px; min-height: 20px; }
        .btn-comprobar { background-color: var(--accent-action); color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; margin-top: auto; transition: background 0.3s;}
        .renglones-print { display: none; width: 100%; height: 60px; background: repeating-linear-gradient(transparent, transparent 29px, #ccc 30px); margin-top: auto; margin-bottom: 10px;}

        .vista-renglones .opciones-grid, .vista-renglones .respuesta-input, .vista-renglones .feedback-msg, .vista-renglones .btn-comprobar { display: none !important; }
        .vista-renglones .renglones-print { display: block !important; }
        .vista-texto .opciones-grid, .vista-texto .respuesta-input, .vista-texto .feedback-msg, .vista-texto .btn-comprobar, .vista-texto .renglones-print { display: none !important; }
        
        @media print {
            header.docente-header, .zona-pegado, .zona-vistas, .print-selector, #header-navegacion { display: none !important; }
            body { background-color: white; padding: 0; }
            #bateria-container { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 20px !important; }
            .problema-card { break-inside: avoid; border: 1px solid #ccc; box-shadow: none; border-top: 3px solid var(--accent-math);}
        }
    </style>
</head>
<body class="vista-interactiva">
    <div class="container">
        <header class="docente-header">
            <h1>CONSTRUCTOR DE MATEMÁTICA</h1>
            <p class="subtitulo">Generador Pro (Corrección de Pie Creative Commons)</p>
        </header>

        <div class="zona-pegado" id="zona-controles">
            <textarea id="gem-input" placeholder="Pegá aquí el texto de la GEM..."></textarea>
            <div style="text-align: center;"><button class="btn-generar" onclick="procesarTexto()">1. Generar Fichas</button></div>
        </div>

        <div class="zona-vistas" id="zona-vistas">
            <div class="botones-vistas">
                <button class="btn-vista activa" id="btn-v-int" onclick="cambiarVista('vista-interactiva')">💻 Digital</button>
                <button class="btn-vista" id="btn-v-ren" onclick="cambiarVista('vista-renglones')">📝 Fotocopia</button>
                <button class="btn-vista" id="btn-v-tex" onclick="cambiarVista('vista-texto')">📖 Carpeta</button>
                <button class="btn-vista btn-copiar" onclick="abrirModalCopiado()">📄 Copiar / Editar</button>
                <button class="btn-vista btn-limpiar" onclick="limpiarMisPruebas()">🧹 Limpiar</button>
                <button class="btn-vista btn-reiniciar" onclick="borrarMemoriaCompleta()">🚨 Borrar Todo</button>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; justify-content: center; align-items: center; padding-top: 15px; border-top: 1px solid #eee;">
                <input type="text" id="titulo-export" class="input-titulo" placeholder="Nombre de la actividad" value="Actividad de Matemática">
                <button class="btn-vista btn-imprimir" onclick="imprimirSeleccionadas()">🖨️ Mandar a Impresora</button>
                <button class="btn-vista btn-exportar" onclick="exportarHTML()">💾 Exportar Actividad</button>
            </div>
        </div>
        <div id="bateria-container"></div>
    </div>

    <script id="motor-js">
        function guardarProgresoAlumno() {
            try {
                const cards = document.querySelectorAll('.problema-card');
                let data = [];
                cards.forEach((card, index) => {
                    const input = card.querySelector('.respuesta-input');
                    const selectedBtn = card.querySelector('.opcion-btn.selected');
                    const feedbackMsg = card.querySelector('.feedback-msg');
                    const btnComp = card.querySelector('.btn-comprobar');
                    data.push({
                        text: input ? input.value : null,
                        choice: selectedBtn ? selectedBtn.innerText : null,
                        feedback: feedbackMsg ? feedbackMsg.innerHTML : '',
                        feedbackColor: feedbackMsg ? feedbackMsg.style.color : '',
                        btnText: btnComp ? btnComp.innerText : 'COMPROBAR',
                        btnBg: btnComp ? btnComp.style.backgroundColor : ''
                    });
                });
                localStorage.setItem('mat_progreso_alumno', JSON.stringify(data));
            } catch(e) {}
        }

        function cargarProgresoAlumno() {
            try {
                const saved = localStorage.getItem('mat_progreso_alumno');
                if (!saved) return;
                const data = JSON.parse(saved);
                const cards = document.querySelectorAll('.problema-card');
                data.forEach((item, index) => {
                    const card = cards[index];
                    if (!card) return;
                    if (item.text !== null) {
                        const input = card.querySelector('.respuesta-input');
                        if (input) input.value = item.text;
                    }
                    if (item.choice !== null) {
                        const btns = card.querySelectorAll('.opcion-btn');
                        btns.forEach(b => { if (b.innerText === item.choice) b.classList.add('selected'); });
                    }
                    const fmsg = card.querySelector('.feedback-msg');
                    if (fmsg) { fmsg.innerHTML = item.feedback; fmsg.style.color = item.feedbackColor; }
                    const btn = card.querySelector('.btn-comprobar');
                    if (btn && item.btnText) { btn.innerText = item.btnText; btn.style.backgroundColor = item.btnBg; }
                });
            } catch(e) {}
        }

        function reiniciarFichas() {
            document.querySelectorAll('.opcion-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelectorAll('.respuesta-input').forEach(input => input.value = '');
            document.querySelectorAll('.feedback-msg').forEach(msg => { msg.innerHTML = ''; msg.style.color = ''; });
            document.querySelectorAll('.btn-comprobar').forEach(btn => { btn.style.backgroundColor = '#e67e22'; btn.innerText = 'COMPROBAR'; });
        }

        function limpiarMisPruebas() {
            if(confirm("¿Limpiar tus pruebas? Las fichas quedarán vacías.")) {
                reiniciarFichas();
                localStorage.removeItem('mat_progreso_alumno'); 
            }
        }

        function seleccionarOpcion(btn) {
            let contenedor = btn.parentElement;
            Array.from(contenedor.getElementsByClassName('opcion-btn')).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            guardarProgresoAlumno();
        }

        function verificarRespuesta(btn) {
            try {
                let tarjeta = btn.closest('.problema-card');
                let feedback = tarjeta.querySelector('.feedback-msg');
                let tipo = btn.getAttribute('data-tipo');
                let numCor = btn.getAttribute('data-correcta').replace(/[^0-9]/g, '');
                let esCorrecto = false;
                if (tipo.indexOf('CHOICE') !== -1) {
                    let sel = tarjeta.querySelector('.opcion-btn.selected');
                    if (!sel) { feedback.innerHTML = "⚠️ Elegí una opción."; return; }
                    if (sel.innerText.replace(/[^0-9]/g, '') === numCor) esCorrecto = true;
                } else {
                    let input = tarjeta.querySelector('.respuesta-input');
                    if (!input || !input.value.trim()) { feedback.innerHTML = "⚠️ Escribí algo."; return; }
                    if (input.value.replace(/[^0-9]/g, '') === numCor) esCorrecto = true;
                }
                if (esCorrecto) {
                    feedback.innerHTML = "✅ ¡Correcto!"; feedback.style.color = "#27ae60";
                    btn.style.backgroundColor = "#27ae60"; btn.innerText = "¡RESUELTO!";
                } else {
                    feedback.innerHTML = "❌ Revisalo e intentá de nuevo"; feedback.style.color = "#d31718";
                }
                guardarProgresoAlumno();
            } catch(e) {}
        }

        function cambiarVista(claseVista) {
            document.body.className = claseVista;
            document.querySelectorAll('.btn-vista').forEach(b => b.classList.remove('activa'));
            const btnId = claseVista === 'vista-interactiva' ? 'btn-v-int' : claseVista === 'vista-renglones' ? 'btn-v-ren' : 'btn-v-tex';
            const btn = document.getElementById(btnId);
            if(btn) btn.classList.add('activa');
            localStorage.setItem('mat_vista_pref', claseVista);
        }

        function borrarMemoriaCompleta() {
            if(confirm("¿🚨 Borrar todo? Se perderá el texto y las fichas.")) {
                localStorage.clear();
                location.reload();
            }
        }

        function imprimirSeleccionadas() {
            const cards = document.querySelectorAll('.problema-card');
            cards.forEach(card => {
                const chk = card.querySelector('.chk-print');
                card.style.display = (chk && chk.checked) ? 'flex' : 'none';
            });
            window.print();
            setTimeout(() => { cards.forEach(c => c.style.display = 'flex'); }, 1000);
        }

        function abrirModalCopiado() {
            let htmlAcumulado = "";
            let inputTitulo = document.getElementById('titulo-export');
            let tituloGral = inputTitulo ? inputTitulo.value : (document.querySelector('.zona-vistas h3') ? document.querySelector('.zona-vistas h3').innerText : "Actividad de Matemática");
            
            let contador = 1;

            document.querySelectorAll('.problema-card').forEach(card => {
                const chk = card.querySelector('.chk-print');
                if (chk && chk.checked) {
                    const titulo = card.querySelector('.titulo-problema').innerText;
                    const enunciado = card.querySelector('.enunciado').innerText;
                    
                    htmlAcumulado += '<div style="margin-bottom: 18px;">';
                    htmlAcumulado += '<h2 style="font-family: Arial, sans-serif; font-size: 14pt; color: #d31718; margin: 0 0 4px 0;">' + contador + '. ' + titulo + '</h2>';
                    htmlAcumulado += '<p style="font-family: Arial, sans-serif; font-size: 12pt; margin: 0;">' + enunciado + '</p>';
                    htmlAcumulado += '</div>';
                    
                    contador++;
                }
            });

            if (!htmlAcumulado) { alert("⚠️ No tildaste ninguna ficha."); return; }

            const modal = document.createElement('div');
            modal.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; display:flex; align-items:center; justify-content:center; padding:15px; box-sizing:border-box;";
            
            const box = document.createElement('div');
            box.style = "background:white; width:100%; max-width:650px; max-height:90vh; border-radius:12px; display:flex; flex-direction:column; box-shadow:0 15px 40px rgba(0,0,0,0.5); overflow:hidden;";
            
            box.innerHTML = '<div style="padding:15px; background:#036fb0; color:white; font-weight:bold; display:flex; justify-content:space-between; align-items:center;"><span>Vista Previa y Edición</span><button onclick="this.closest(\'div\').parentElement.parentElement.remove()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">✕</button></div>';
            
            const area = document.createElement('div');
            area.id = "area-preview-word";
            area.contentEditable = "true";
            area.style = "padding:25px; overflow-y:auto; flex-grow:1; background:#fff; outline:none; color:#333;";
            area.innerHTML = htmlAcumulado;
            
            const footer = document.createElement('div');
            footer.style = "padding:15px; border-top:1px solid #eee; display:flex; gap:10px; justify-content:center; background:#f8f9fa; flex-wrap:wrap;";
            
            const btnCopy = document.createElement('button');
            btnCopy.innerHTML = "📋 COPIAR";
            btnCopy.style = "background:#27ae60; color:white; border:none; padding:12px 20px; border-radius:5px; font-weight:bold; cursor:pointer;";
            btnCopy.onclick = function() {
                const range = document.createRange();
                range.selectNodeContents(area);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                btnCopy.innerHTML = "✅ ¡COPIADO!";
                setTimeout(() => { btnCopy.innerHTML = "📋 COPIAR"; }, 2000);
            };

            const btnEditor = document.createElement('button');
            btnEditor.innerHTML = "🚀 ENVIAR AL EDITOR";
            btnEditor.style = "background:#036fb0; color:white; border:none; padding:12px 20px; border-radius:5px; font-weight:bold; cursor:pointer;";
            btnEditor.onclick = function() {
                let packageHTML = "<h3>" + tituloGral + "</h3>" + area.innerHTML;
                localStorage.setItem('import_content', packageHTML);
                window.open('https://escolar.com.ar/editor.html', 'Editor de Textos');
            };

            const btnPrint = document.createElement('button');
            btnPrint.innerHTML = "🖨️ IMPRIMIR";
            btnPrint.style = "background:#34495e; color:white; border:none; padding:12px 20px; border-radius:5px; font-weight:bold; cursor:pointer;";
            btnPrint.onclick = () => {
                const win = window.open('', 'PRINT');
                win.document.write('<html><head><title>Imprimir</title></head><body>' + area.innerHTML + '</body></html>');
                win.document.close();
                win.print();
                win.close();
            };

            footer.appendChild(btnCopy);
            footer.appendChild(btnEditor);
            footer.appendChild(btnPrint);
            box.appendChild(area);
            box.appendChild(footer);
            modal.appendChild(box);
            document.body.appendChild(modal);
        }

        function procesarTexto() {
            try {
                const texto = document.getElementById('gem-input').value;
                if(!texto.trim()) return;
                localStorage.setItem('mat_input_save', texto);
                const contenedor = document.getElementById('bateria-container');
                contenedor.innerHTML = ''; 
                const fragmentos = texto.split(/\[PROBLEMA\s+\d+\]/i);
                fragmentos.forEach(frag => {
                    if(!frag.trim()) return;
                    const titulo = extraerEtiqueta(frag, 'TITULO');
                    const tipo = extraerEtiqueta(frag, 'TIPO').toUpperCase();
                    const enunciado = extraerEtiqueta(frag, 'ENUNCIADO');
                    const opciones = extraerEtiqueta(frag, 'OPCIONES');
                    const correcta = extraerEtiqueta(frag, 'CORRECTA');
                    let cardHTML = `<div class="problema-card"><label class="print-selector"><input type="checkbox" class="chk-print" checked> Imprimir</label><h2 class="titulo-problema">${titulo}</h2><p class="enunciado">${enunciado}</p>`;
                    if (tipo.includes('CHOICE')) {
                        cardHTML += '<div class="opciones-grid">';
                        opciones.split('|').forEach(op => { cardHTML += `<div class="opcion-btn" onclick="seleccionarOpcion(this)">${op.trim()}</div>`; });
                        cardHTML += '</div>';
                    } else {
                        cardHTML += '<input type="text" class="respuesta-input" oninput="guardarProgresoAlumno()" placeholder="Número aquí...">';
                    }
                    cardHTML += `<div class="renglones-print"></div><div class="feedback-msg"></div><button class="btn-comprobar" data-correcta="${correcta.replace(/"/g, '&quot;')}" data-tipo="${tipo}" onclick="verificarRespuesta(this)">Comprobar</button></div>`;
                    contenedor.innerHTML += cardHTML;
                });
                document.getElementById('zona-vistas').style.display = 'block';
                cambiarVista(localStorage.getItem('mat_vista_pref') || 'vista-interactiva');
                cargarProgresoAlumno();
            } catch(e) {}
        }

        function extraerEtiqueta(texto, etiqueta) {
            const inicio = texto.indexOf('[' + etiqueta + ']');
            if (inicio === -1) return '';
            const dInicio = inicio + etiqueta.length + 2;
            let fin = texto.indexOf('[', dInicio);
            if (fin === -1) fin = texto.length;
            return texto.substring(dInicio, fin).trim();
        }

        window.onload = function() {
            const inputArea = document.getElementById('gem-input');
            if(inputArea) { 
                const guardado = localStorage.getItem('mat_input_save');
                if(guardado) { inputArea.value = guardado; procesarTexto(); }
            } else { cargarProgresoAlumno(); }
        }

        function exportarHTML() {
            const tituloCustom = document.getElementById('titulo-export').value.trim() || 'Actividad de Matemática';
            const filename = tituloCustom.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_").toLowerCase() + '.html';
            reiniciarFichas();
            localStorage.removeItem('mat_progreso_alumno'); 
            const gridHTML = document.getElementById('bateria-container').innerHTML;
            const cssHTML = document.querySelector('style').innerHTML;
            const jsHTML = document.getElementById('motor-js').textContent; 
            const vistaActual = document.body.className;
            cargarProgresoAlumno();
            
            const analytics = '<script async src="https://www.googletagmanager.com/gtag/js?id=G-VL13MMLPRV"><' + '/script><script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag("js", new Date()); gtag("config", "G-VL13MMLPRV");<' + '/script>';
            const headerSitio = '<header id="header-navegacion" style="background-color: #2c3e50; padding: 10px 0; font-family: \'Roboto\', sans-serif; width: 100%; box-sizing: border-box; flex-shrink: 0; z-index: 1000; position: sticky; top: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"><nav style="max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;"><a href="../index.html" style="text-decoration: none; display: flex; align-items: center;"><img src="../logo.png" alt="Recursos Educativos" style="height: 60px; width: auto; transition: transform 0.2s;"></a><div style="display: flex; gap: 20px; align-items: center;"><a href="../lengua.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Lengua</a><a href="../matematica.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Matemática</a><a href="../recursos.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Recursos</a><a href="../diseno.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Diseño</a></div></nav></header>';
