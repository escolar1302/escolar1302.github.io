<!DOCTYPE html>
<html lang="es">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VL13MMLPRV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VL13MMLPRV');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anterior y Posterior</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           ESTILOS GENERALES
           ========================================= */
        body {
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #dbe9d8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* =========================================
           BARRA DE NAVEGACIÓN
           ========================================= */
        header {
            background-color: #2c3e50;
            padding: 15px 0;
            margin-bottom: 20px;
            font-family: 'Roboto', sans-serif;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a { color: white; text-decoration: none; font-size: 0.9rem; margin-left: 15px;}
        .nav-links a:hover { text-decoration: underline; }

        /* =========================================
           CONTENEDOR DEL JUEGO
           ========================================= */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 95%;
            width: 750px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 { color: #2c3e50; margin-top: 0; font-size: 1.8rem; margin-bottom: 20px;}
        
        /* Botones de Selección */
        .difficulty-selector {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-diff {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-diff:hover { background-color: #d5dbdb; }

        .btn-diff.active {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background-color: #fff;
        }

        th {
            color: white;
            padding: 15px;
            font-size: 1.1rem;
        }
        
        th:nth-child(1) { background-color: #e67e22; border-radius: 10px 0 0 0; } /* Anterior */
        th:nth-child(2) { background-color: #2c3e50; } /* Numero */
        th:nth-child(3) { background-color: #27ae60; border-radius: 0 10px 0 0; } /* Posterior */

        td {
            padding: 15px 5px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        /* Número Central */
        .numero-central {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            background-color: #ecf0f1;
            padding: 8px 20px;
            border-radius: 12px;
            display: inline-block;
            min-width: 60px;
        }

        /* Inputs */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input {
            width: 80px;
            padding: 10px;
            font-size: 1.3rem;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border 0.2s;
            -moz-appearance: textfield; /* Quitar flechas en Firefox */
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none; /* Quitar flechas en Chrome */
            margin: 0;
        }

        input:focus { border-color: #3498db; }

        /* Iconos (Tilde / Cruz) */
        .feedback-icon {
            font-size: 1.5rem;
            margin-left: 8px;
            width: 30px;
            display: inline-block;
            text-align: left;
        }

        /* Acciones */
        .actions { margin-top: 25px; }

        button.btn-action {
            padding: 12px 35px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            color: white;
            margin: 0 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        button.btn-action:active { transform: scale(0.95); }

        #btn-validar { background-color: #27ae60; }
        #btn-reiniciar { background-color: #3498db; display: none; }

        #mensaje {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 30px;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .container { padding: 15px; width: 100%; box-sizing: border-box; }
            h1 { font-size: 1.4rem; }
            input { width: 55px; font-size: 1.1rem; padding: 5px; }
            th { font-size: 0.9rem; padding: 10px; }
            .numero-central { font-size: 1.3rem; padding: 5px 10px; }
            /* En móvil, los iconos bajan para no apretar */
            .feedback-icon { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); margin: 0; }
            td { padding-bottom: 25px; } 
        }
    </style>
</head>
<body>



<div class="container">
    <h1>Anterior y Posterior</h1>
    
    <div class="difficulty-selector">
        <button class="btn-diff active" id="btn-100" onclick="cambiarRango(100)">Hasta 100</button>
        <button class="btn-diff" id="btn-1000" onclick="cambiarRango(1000)">Hasta 1.000</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Anterior (-1)</th>
                <th>Número</th>
                <th>Posterior (+1)</th>
            </tr>
        </thead>
        <tbody id="tabla-ejercicios">
            </tbody>
    </table>

    <div id="mensaje"></div>

    <div class="actions">
        <button id="btn-validar" class="btn-action" onclick="validarResultados()">✅ Corregir</button>
        <button id="btn-reiniciar" class="btn-action" onclick="generarEjercicios()">🔄 Nuevos Números</button>
    </div>
</div>

<script>
    let rangoMaximo = 100; // Valor inicial

    // Cambiar dificultad
    function cambiarRango(max) {
        rangoMaximo = max;
        
        // Actualizar estilo botones
        document.getElementById('btn-100').classList.toggle('active', max === 100);
        document.getElementById('btn-1000').classList.toggle('active', max === 1000);
        
        // Regenerar tabla
        generarEjercicios();
    }

    // Generar tabla
    function generarEjercicios() {
        const tbody = document.getElementById('tabla-ejercicios');
        const mensaje = document.getElementById('mensaje');
        const btnValidar = document.getElementById('btn-validar');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        // Limpiar
        tbody.innerHTML = '';
        mensaje.textContent = '';
        btnValidar.style.display = 'inline-block';
        btnReiniciar.style.display = 'none';

        let listaNumeros = [];

        // --- LÓGICA DIDÁCTICA ---
        if (rangoMaximo === 100) {
            // 1. Número terminado en 0 (ej: 40)
            listaNumeros.push( (Math.floor(Math.random() * 8) + 1) * 10 );
            // 2. Número terminado en 9 (ej: 39)
            listaNumeros.push( (Math.floor(Math.random() * 8) * 10) + 9 ); 
            
            // Rellenar hasta tener 6 números
            while (listaNumeros.length < 6) {
                let n = Math.floor(Math.random() * 97) + 2;
                if (!listaNumeros.includes(n)) listaNumeros.push(n);
            }

        } else { // Hasta 1000
            // 1. Número terminado en 00 (ej: 300)
            listaNumeros.push( (Math.floor(Math.random() * 8) + 1) * 100 );
            // 2. Número terminado en 99 (ej: 299)
            listaNumeros.push( (Math.floor(Math.random() * 8) * 100) + 99 );

            // Rellenar
            while (listaNumeros.length < 6) {
                let n = Math.floor(Math.random() * 890) + 100;
                if (!listaNumeros.includes(n)) listaNumeros.push(n);
            }
        }

        // Mezclar para que los especiales no salgan siempre primero
        listaNumeros.sort(() => Math.random() - 0.5);

        // Crear filas HTML
        listaNumeros.forEach(num => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="input-wrapper">
                        <input type="number" class="input-ant" data-target="${num - 1}" placeholder="?">
                        <span class="feedback-icon"></span>
                    </div>
                </td>
                <td><span class="numero-central">${num}</span></td>
                <td>
                    <div class="input-wrapper">
                        <input type="number" class="input-post" data-target="${num + 1}" placeholder="?">
                        <span class="feedback-icon"></span>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Corregir
    function validarResultados() {
        const inputs = document.querySelectorAll('input');
        let errores = 0;
        let vacios = 0;

        inputs.forEach(input => {
            const valorUsuario = input.value === '' ? NaN : parseInt(input.value);
            const valorCorrecto = parseInt(input.dataset.target);
            const iconSpan = input.nextElementSibling;

            // Reset
            input.style.borderColor = "#ccc";
            input.style.backgroundColor = "white";

            if (isNaN(valorUsuario)) {
                vacios++;
                iconSpan.textContent = ''; 
                input.style.borderColor = "#f1c40f"; // Amarillo si está vacío
            } else if (valorUsuario === valorCorrecto) {
                iconSpan.textContent = '✅';
                input.style.borderColor = "#27ae60";
                input.style.backgroundColor = "#eafaf1";
                input.disabled = true; // Bloquear correcto
            } else {
                errores++;
                iconSpan.textContent = '❌';
                input.style.borderColor = "#e74c3c";
                input.style.backgroundColor = "#fdedea";
            }
        });

        const mensaje = document.getElementById('mensaje');
        
        if (errores === 0 && vacios === 0) {
            mensaje.textContent = "¡Excelente! Todo correcto 🎉";
            mensaje.style.color = "#27ae60";
            document.getElementById('btn-validar').style.display = 'none';
            document.getElementById('btn-reiniciar').style.display = 'inline-block';
        } else if (vacios > 0) {
            mensaje.textContent = "Faltan completar casilleros.";
            mensaje.style.color = "#f39c12";
        } else {
            mensaje.textContent = "Hay errores. Revisa los cuadros rojos.";
            mensaje.style.color = "#c0392b";
        }
    }

    // Iniciar juego al cargar la página
    document.addEventListener('DOMContentLoaded', generarEjercicios);

</script>
<div id="contenedor-pie"></div>

<script>
  fetch('/pie.html')
    .then(response => {
      if (response.ok) return response.text();
      throw new Error('No se pudo cargar el pie de página');
    })
    .then(data => {
      document.getElementById('contenedor-pie').innerHTML = data;
    })
    .catch(error => console.error('Error:', error));
</script>
<script src="/volver.js" defer></script>
</body>
</html>
