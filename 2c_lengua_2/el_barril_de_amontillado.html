        function detectarTituloActividad(texto){const lineas=normalizarSaltos(texto).split('\n').map(l=>l.trim()).filter(Boolean);if(!lineas.length)return'';const primera=lineas[0];let m=primera.match(/^\[ACTIVIDAD\]\s*(.+)$/i);if(m)return m[1].trim();m=primera.match(/^Actividad\s+de\s+lectura\s*:\s*(.+)$/i);if(m)return m[1].trim();m=primera.match(/^Actividad\s*:\s*(.+)$/i);if(m)return m[1].trim();return''}function esLineaTituloActividad(linea){return/^\s*(\[ACTIVIDAD\]|Actividad\s+de\s+lectura\s*:|Actividad\s*:)/i.test(linea)}function detectarInicioPregunta(linea){const limpio=String(linea||'').trim();if(!limpio)return null;let m=limpio.match(/^(\d+)[\.)]\s*(.*)$/);if(m)return{textoInicial:m[2].trim()};m=limpio.match(/^Punto\s+\d+\s*[\.:]?\s*(?:Consigna\s+\d+\s*[\.:]?\s*)?(.*)$/i);if(m)return{textoInicial:m[1].trim()};m=limpio.match(/^Consigna\s+\d+\s*[\.:]?\s*(.*)$/i);if(m)return{textoInicial:m[1].trim()};return null}function parsearTabla(lineasTabla){const crudas=lineasTabla.map(l=>String(l||'').trim()).filter(l=>l&&l.includes('|'));if(!crudas.length)return null;const filas=crudas.map(linea=>linea.split('|').map(c=>c.trim()));const maxCols=Math.max.apply(null,filas.map(f=>f.length));filas.forEach(f=>{while(f.length<maxCols)f.push('')});if(filas.length<2||maxCols<2)return null;return{encabezados:filas[0],filas:filas.slice(1).map(f=>f.map(c=>({texto:c,editable:c===''})))}}function limpiarBlancosExtremos(lineas){const c=lineas.slice();while(c.length&&!String(c[0]).trim())c.shift();while(c.length&&!String(c[c.length-1]).trim())c.pop();return c}
        function extraerItemOrden(linea){

        function parsearPreguntasAbiertas(texto){
