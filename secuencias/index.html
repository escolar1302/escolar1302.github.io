<!DOCTYPE html>
<html lang="es">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VL13MMLPRV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VL13MMLPRV');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secuencias de Lengua · Biblioteca</title>
<meta name="description" content="Biblioteca de cuentos con secuencias didácticas, fichas, guías docentes y autoevaluaciones para descargar.">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --theme:#27AE60; --soft:#E8F5E9; --title:#1B5E20;
  --docente:#E67E22; --docente-soft:#FDF1E4; --docente-title:#A34E00;
  --auto:#036FB0; --auto-soft:#E3F2FD; --auto-title:#01579B;
  --nav:#2c3e50; --text:#263238;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--soft);font-family:'Nunito',sans-serif;color:var(--text);line-height:1.5}
.site-nav{background:var(--nav);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 3px 10px rgba(0,0,0,.22);position:relative;z-index:10}
.site-nav img{height:54px;max-width:220px;object-fit:contain}
.site-nav nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.site-nav a{color:#fff;text-decoration:none;font-weight:800;font-size:.95rem}

.page-header{background:var(--theme);color:#fff;padding:34px 20px}
.hero-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:24px}
.hero-text{flex:1;min-width:0;text-align:center}
.hero-text h1{margin:0 0 6px;font-size:clamp(2rem,4vw,2.8rem);line-height:1.05}
.hero-text p{margin:0;font-size:1.1rem;opacity:.93}
.hero-img{max-height:130px;max-width:170px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}

/* Barra de filtros fija */
.barra{position:sticky;top:0;z-index:9;background:var(--soft);transition:box-shadow .2s}
.barra.pegada{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.barra-in{max-width:1100px;margin:0 auto;padding:12px 20px;display:grid;gap:10px}
.fila1{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:2px solid var(--nav);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:var(--nav);font:800 .9rem 'Nunito',sans-serif;padding:7px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--nav);color:#fff}
.campos{display:flex;gap:10px;flex:1 1 380px;justify-content:flex-end;flex-wrap:wrap}
.buscar,.sel{padding:9px 16px;border:2px solid rgba(0,0,0,.08);border-radius:999px;font:inherit;background:#fff;color:var(--text)}
.buscar{flex:1 1 220px;min-width:0;max-width:360px}
.sel{flex:0 1 220px;max-width:100%}
.buscar:focus,.sel:focus{outline:2px solid var(--theme);outline-offset:1px}
.generos{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.gchip{flex:0 0 auto;border:2px solid var(--c,var(--nav));background:#fff;color:var(--c,var(--nav));border-radius:999px;padding:4px 14px;font:800 .84rem 'Nunito',sans-serif;cursor:pointer;white-space:nowrap}
.gchip[aria-pressed="true"]{background:var(--c,var(--nav));color:#fff}
.gchip small{opacity:.75;font-weight:700;margin-left:4px}
button:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--nav);outline-offset:2px}

.page-wrap{max-width:1100px;margin:0 auto;padding:18px 20px 70px;min-height:60vh}
.estado{margin:0 0 14px;color:#546E7A;font-weight:700;font-size:.92rem}
.estado button{border:0;background:none;color:var(--auto-title);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0 0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}

/* Tarjeta "lomo de libro" */
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08);transition:transform .16s,box-shadow .16s;min-height:170px}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.14)}
.card:focus-visible{outline:3px solid var(--nav);outline-offset:2px}
.card-top{background:var(--c);color:#fff;padding:7px 14px;font-weight:800;font-size:.78rem;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:1.18rem;line-height:1.2;color:var(--title)}
.card .aut{margin:0;color:#607D8B;font-weight:700;font-size:.9rem}
.card .desc{margin:0;color:#607D8B;font-size:.88rem}
.marcas{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:10px}
.marca{font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 9px;border:1.5px solid}
.marca.aula{color:var(--title);border-color:var(--theme);background:var(--soft)}
.marca.docente{color:var(--docente-title);border-color:var(--docente);background:var(--docente-soft)}
.marca.auto{color:var(--auto-title);border-color:var(--auto);background:var(--auto-soft)}

/* Panel lateral con todos los documentos */
dialog{border:0;padding:0;margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(440px,100%);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.25);animation:entra .22s ease-out}
dialog::backdrop{background:rgba(20,30,40,.45)}
@keyframes entra{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog{animation:none}}
.p-head{background:var(--c,var(--nav));color:#fff;padding:18px 20px 16px;position:relative}
.p-head h2{margin:0 40px 4px 0;font-size:1.5rem;line-height:1.15}
.p-head p{margin:0;opacity:.92;font-weight:700}
.p-x{position:absolute;top:10px;right:12px;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:1.4rem;line-height:1;width:36px;height:36px;border-radius:50%;cursor:pointer}
.p-x:hover{background:rgba(255,255,255,.35)}
.p-body{padding:16px 20px 30px;overflow-y:auto;height:calc(100dvh - 100px)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.tag{font-size:.78rem;font-weight:800;border-radius:999px;padding:2px 11px;border:1px solid #cfd8dc;background:#ECEFF1;color:var(--nav)}
.tag.tema{background:#fff;color:#607D8B;font-weight:700}
.sub{margin:18px 0 8px;font-size:1rem;font-weight:900;text-align:center;border-bottom:2px solid rgba(0,0,0,.08);padding-bottom:5px}
.sub.aula{color:var(--theme)} .sub.docente{color:var(--docente-title);border-color:rgba(230,126,34,.35)} .sub.auto{color:var(--auto-title);border-color:rgba(3,111,176,.3)}
.btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:320px;min-height:38px;padding:7px 14px;border-radius:999px;border:2px solid var(--theme);background:#fff;color:var(--text);text-decoration:none;font-weight:900;text-align:center;transition:.16s}
.btn:hover{background:var(--soft);transform:translateY(-1px)}
.btn.docente{border-color:var(--docente)} .btn.docente:hover{background:var(--docente-soft)}
.btn.auto{border-color:var(--auto)} .btn.auto:hover{background:var(--auto-soft)}
.btn.pronto{border-color:#cfd8dc;color:#90a4ae;background:#f6f8fb;cursor:default}
.btn.pronto:hover{transform:none;background:#f6f8fb}
.btn-col{display:flex;flex-direction:column;align-items:center;width:100%}
.btn-col small{font-size:.8rem;color:#78909C;font-weight:700;margin-top:2px}
.lista-p{margin:0;padding-left:24px}
.lista-p li{margin:0 0 6px}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:800;color:var(--title);cursor:pointer;text-decoration:underline;text-align:left}
.lnk small{display:block;color:#78909C;font-weight:600;text-decoration:none}
.vacio{text-align:center;font-weight:700;margin:40px 0}
@media(max-width:850px){.hero-inner{flex-direction:column}.site-nav,.site-nav nav{justify-content:center}.campos{justify-content:stretch}}
@media(max-width:600px){.barra-in{padding:8px 14px}.hero-img{display:none}.grid{grid-template-columns:1fr}.page-header{padding:24px 16px}}
</style>
</head>
<body>


<section class="page-header"><div class="hero-inner">
  <img class="hero-img" src="../images/oso-lengua.png" alt="" onerror="this.style.display='none'">
  <div class="hero-text"><h1>Secuencias de Lengua</h1><p>Elegí un cuento y encontrá todo su material en un solo lugar</p></div>
  <img class="hero-img" src="../images/tres-lengua.png" alt="" onerror="this.style.display='none'">
</div></section>

<div id="centinela" style="height:1px;margin-bottom:-1px" aria-hidden="true"></div>
<div id="barra" class="barra"><div class="barra-in">
  <div class="fila1">
    <div class="seg" role="group" aria-label="Qué mostrar">
      <button type="button" data-v="cuentos" aria-pressed="true">Cuentos</button>
      <button type="button" data-v="recorridos" aria-pressed="false">Recorridos</button>
    </div>
    <div class="campos">
      <input id="buscar" class="buscar" type="search" placeholder="Buscar título, autor o tema…" aria-label="Buscar">
      <select id="autor" class="sel" aria-label="Filtrar por autor"><option value="">Todos los autores</option></select>
    </div>
  </div>
  <div id="generos" class="generos" role="group" aria-label="Filtrar por género"></div>
</div></div>

<main class="page-wrap">
  <p id="estado" class="estado"></p>
  <section id="lista" class="grid" aria-live="polite"></section>
  <p id="vacio" class="vacio" hidden>No se encontró nada con esa búsqueda.</p>
</main>

<dialog id="panel" aria-labelledby="p-tit"></dialog>

<script src="cuentos.js"></script>
<script src="catalogo-core.js"></script>
<script>
(function(){
  "use strict";
  const C = window.Catalogo;
  const $ = id => document.getElementById(id);
  function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  const st = {vista: "cuentos", genero: "", autor: "", q: ""};

  /* ---------- Filtros ---------- */
  const autores = Array.from(new Set(C.cuentos.map(c => c.autor).filter(Boolean)))
      .sort((a, b) => (a === "Anónimo") - (b === "Anónimo") || a.localeCompare(b, "es"));
  autores.forEach(a => { const o = el("option", null, a); o.value = a; $("autor").appendChild(o); });

  function pintarGeneros(){
    const box = $("generos"); box.replaceChildren();
    const mk = (valor, texto, n, color) => {
      const b = el("button", "gchip"); b.type = "button";
      b.style.setProperty("--c", color || "var(--nav)");
      b.setAttribute("aria-pressed", st.genero === valor ? "true" : "false");
      b.append(texto); const s = el("small", null, String(n)); b.appendChild(s);
      b.addEventListener("click", () => { st.genero = (st.genero === valor ? "" : valor); render(); pintarGeneros(); });
      box.appendChild(b);
    };
    mk("", "Todos", C.cuentos.length);
    C.generos.forEach(g => { const n = C.cuentos.filter(c => c.genero === g).length; if (n) mk(g, g, n, C.colorGenero(g)); });
  }

  /* ---------- Tarjetas ---------- */
  function marcas(it){
    const m = el("div", "marcas");
    const add = (t, cls) => m.appendChild(el("span", "marca " + cls, t));
    if (C.tiene(it, ["cuento", "texto2", "texto3"])) add("Cuento", "aula");
    if (C.tiene(it, ["secuencia"])) add("Secuencia", "aula");
    if (C.tiene(it, ["fichas"])) add("Fichas", "aula");
    if (C.tiene(it, ["secuencia_guia", "fichas_guia"])) add("Guía docente", "docente");
    if (it.auto) add("Autoevaluación", "auto");
    return m;
  }
  function tarjeta(it){
    const b = el("button", "card"); b.type = "button";
    b.style.setProperty("--c", it.color);
    const top = el("div", "card-top");
    top.appendChild(el("span", null, it.tipo === "reco" ? "Recorrido" : (it.genero || "Sin clasificar")));
    if (it.tipo === "reco") top.appendChild(el("span", null, it.miembros.length + " cuentos"));
    b.appendChild(top);
    const body = el("div", "card-body");
    body.appendChild(el("h3", null, it.titulo));
    if (it.tipo === "cuento" && it.autor) body.appendChild(el("p", "aut", it.autor));
    if (it.tipo === "reco" && it.descripcion) body.appendChild(el("p", "desc", it.descripcion));
    body.appendChild(marcas(it));
    b.appendChild(body);
    b.addEventListener("click", () => abrir(it));
    return b;
  }

  function render(){
    const lista = $("lista"); lista.replaceChildren();
    let its;
    if (st.vista === "cuentos"){
      its = C.cuentos.filter(c => (!st.genero || c.genero === st.genero) &&
                                  (!st.autor || c.autor === st.autor || c.autoresExtra.indexOf(st.autor) !== -1) &&
                                  C.pasa(c, st.q));
    } else its = C.recorridos.filter(r => C.pasa(r, st.q));
    its.forEach(it => lista.appendChild(tarjeta(it)));
    $("vacio").hidden = its.length > 0;
    const hay = st.genero || st.autor || st.q;
    const e = $("estado"); e.replaceChildren(document.createTextNode(its.length + (st.vista === "cuentos" ? (its.length === 1 ? " cuento" : " cuentos") : (its.length === 1 ? " recorrido" : " recorridos"))));
    if (hay && st.vista === "cuentos"){
      const b = el("button", null, "Quitar filtros"); b.type = "button";
      b.addEventListener("click", () => { st.genero = ""; st.autor = ""; st.q = ""; $("buscar").value = ""; $("autor").value = ""; render(); pintarGeneros(); });
      e.appendChild(b);
    }
    $("generos").hidden = st.vista !== "cuentos";
    $("autor").hidden = st.vista !== "cuentos";
  }

  /* ---------- Panel lateral ---------- */
  const panel = $("panel");
  function grupo(it, nombre, titulo){
    const ds = it.docs.filter(d => d.grupo === nombre);
    const frag = document.createDocumentFragment();
    if (!ds.length) return frag;
    frag.appendChild(el("h3", "sub " + nombre, titulo));
    const b = el("div", "btns");
    ds.forEach(function(d){
      const x = C.enlace(d, "btn");
      if (d.autor){ const col = el("div", "btn-col"); col.appendChild(x); col.appendChild(el("small", null, d.autor)); b.appendChild(col); }
      else b.appendChild(x);
    });
    frag.appendChild(b);
    return frag;
  }
  function abrir(it, noHash){
    panel.replaceChildren();
    panel.style.setProperty("--c", it.color);
    const head = el("div", "p-head");
    head.style.setProperty("--c", it.color);
    const h = el("h2", null, it.titulo); h.id = "p-tit";
    head.appendChild(h);
    head.appendChild(el("p", null, it.tipo === "reco" ? "Recorrido · " + it.miembros.length + " cuentos" : it.autor));
    const x = el("button", "p-x", "×"); x.type = "button"; x.setAttribute("aria-label", "Cerrar");
    x.addEventListener("click", () => panel.close());
    head.appendChild(x);
    panel.appendChild(head);

    const body = el("div", "p-body");
    if (it.tipo === "cuento"){
      const t = el("div", "tags");
      if (it.genero) t.appendChild(el("span", "tag", it.genero));
      it.temas.forEach(x => t.appendChild(el("span", "tag tema", x)));
      if (t.children.length) body.appendChild(t);
    } else if (it.descripcion) body.appendChild(el("p", null, it.descripcion));

    if (it.tipo === "reco" && it.miembros.length){
      body.appendChild(el("h3", "sub aula", "Cuentos del recorrido"));
      const ol = el("ol", "lista-p");
      it.miembros.forEach(function(m){
        const li = el("li"); const b = el("button", "lnk", m.titulo); b.type = "button";
        if (m.autor) b.appendChild(el("small", null, m.autor));
        b.addEventListener("click", () => abrir(m));
        li.appendChild(b); ol.appendChild(li);
      });
      body.appendChild(ol);
    }
    body.appendChild(grupo(it, "aula", it.tipo === "reco" ? "Material del recorrido · aula" : "Para el aula"));
    body.appendChild(grupo(it, "docente", "Para el docente"));
    if (it.auto){
      body.appendChild(el("h3", "sub auto", "Para practicar"));
      const b = el("div", "btns"); const a = el("a", "btn auto", "Autoevaluación"); a.href = it.auto; b.appendChild(a);
      body.appendChild(b);
    }
    if (it.tipo === "cuento" && it.recos.length){
      body.appendChild(el("h3", "sub", it.recos.length > 1 ? "Forma parte de los recorridos" : "Forma parte del recorrido"));
      const ul = el("ul", "lista-p");
      it.recos.forEach(function(r){
        const li = el("li"); const b = el("button", "lnk", r.titulo); b.type = "button";
        b.addEventListener("click", () => abrir(r));
        li.appendChild(b); ul.appendChild(li);
      });
      body.appendChild(ul);
    }
    panel.appendChild(body);
    if (!panel.open) panel.showModal();
    body.scrollTop = 0;
    if (!noHash) try { history.replaceState(null, "", "#" + it.slug); } catch (e) {}
  }
  panel.addEventListener("click", e => { if (e.target === panel) panel.close(); });   // clic en el fondo
  panel.addEventListener("close", () => { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} });

  /* ---------- Eventos ---------- */
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", function(){
    st.vista = b.dataset.v;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    render();
  }));
  $("buscar").addEventListener("input", e => { st.q = e.target.value; render(); });
  $("autor").addEventListener("change", e => { st.autor = e.target.value; render(); });

  // Sombra de la barra cuando está pegada
  if ("IntersectionObserver" in window)
    new IntersectionObserver(es => $("barra").classList.toggle("pegada", !es[0].isIntersecting)).observe($("centinela"));

  pintarGeneros(); render();

  // Enlace directo a un cuento: index_A.html#el_collar
  const h = decodeURIComponent(location.hash.replace("#", ""));
  const directo = C.cuentos.concat(C.recorridos).filter(i => i.slug === h)[0];
  if (directo) abrir(directo, true);
})();
</script>

<div id="contenedor-pie"></div>
<script>
  fetch('/pie.html')
    .then(response => { if (response.ok) return response.text(); throw new Error('No se pudo cargar el pie de página'); })
    .then(data => { document.getElementById('contenedor-pie').innerHTML = data; })
    .catch(error => console.error('Error:', error));
</script>
<script src="/volver.js" defer></script>
</body>
</html>
