            return ':root{--accent-lengua:' + paleta.color + ';--soft-green:' + paleta.soft + ';--accent-title:' + paleta.title + ';}';

            } else {

        function resolverImagenTitulo(img) {
            if (!img) return;

            if (!img.dataset.intentoLocal) {
                img.dataset.intentoLocal = '1';
                img.src = obtenerRutaImagenTituloLocal();

        function claveProgreso() {
            return modoExportado ? 'lengua_choice_progreso_' + slugActividad : 'lengua_choice_progreso_constructor_v1';
        }

        function escaparHTML(valor) {
            return String(valor || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizarSaltos(valor) {
            return String(valor || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        }

        function normalizarLetra(valor) {
            const letra = String(valor || '').trim().toUpperCase();
            return /^[A-DVF]$/.test(letra) ? letra : '';
        }

        function guardarEstado() {
            try {
                localStorage.setItem(claveProgreso(), JSON.stringify({
                    respuestas: respuestas,
                    indiceActual: indiceActual
                }));
            } catch(e) {}
        }

        function cargarEstado() {
            try {
                const guardado = localStorage.getItem(claveProgreso());
                if (!guardado) return;
                const data = JSON.parse(guardado);
                if (Array.isArray(data.respuestas)) respuestas = data.respuestas;
                if (Number.isInteger(data.indiceActual)) indiceActual = data.indiceActual;
                if (indiceActual < 0) indiceActual = 0;
                if (indiceActual > problemas.length) indiceActual = problemas.length;
            } catch(e) {}
        }

        function actualizarMiniResumen() {
            const mini = document.getElementById('mini-resumen');
            if (!mini) return;

            const total = problemas.length;
            const respondidas = respuestas.filter(Boolean).length;
            const correctas = respuestas.filter(r => r && r.esCorrecta).length;
            const incorrectas = respuestas.filter(r => r && !r.esCorrecta).length;

            mini.innerHTML = total
                ? '<span>Respondidas: ' + respondidas + '/' + total + '</span><span>Correctas: ' + correctas + '</span><span>Incorrectas: ' + incorrectas + '</span>'
                : '';

        function informarEstado(mensaje, ok) {
            const estado = document.getElementById('estado-parser');
            if (!estado) return;
            estado.textContent = mensaje || '';
            estado.style.color = ok ? '#2e7d32' : '#c62828';
        }

        function extraerEtiquetaGlobal(texto, etiqueta) {
            const patron = new RegExp('\\[' + etiqueta + '\\]\\s*([^\\n]+)', 'i');
            const match = String(texto || '').match(patron);
            return match ? match[1].trim() : '';
        }

        function crearProblemaVacio(numero, seccion) {
            return {
                numero: numero || '',
                titulo: numero ? 'Pregunta ' + numero : 'Pregunta',
                seccion: seccion || '',
                enunciado: '',
                opciones: [],
                correcta: ''
            };
        }

        function problemaValido(p) {
            return !!(p && p.enunciado && Array.isArray(p.opciones) && p.opciones.length >= 2 && normalizarLetra(p.correcta));
        }

        function parsearFormatoEtiquetado(texto) {
            const lineas = normalizarSaltos(texto).split('\n');
            const lista = [];
            let seccionActual = '';
            let actual = null;
            let campoActual = '';
            let letraActual = '';

            function cerrarActual() {
                if (!actual) return;
                actual.correcta = normalizarLetra(actual.correcta);
                actual.opciones = actual.opciones.filter(op => op && op.letra && op.texto.trim());
                if (problemaValido(actual)) lista.push(actual);
                actual = null;
                campoActual = '';
                letraActual = '';
            }

            lineas.forEach(lineaOriginal => {
                const linea = lineaOriginal.trim();
                if (!linea) return;

                let match = linea.match(/^\[ACTIVIDAD\]\s*(.*)$/i);
                if (match) {
                    tituloActividadDetectado = match[1].trim() || tituloActividadDetectado;
                    campoActual = '';
                    return;
                }

                match = linea.match(/^\[SECCION\]\s*(.*)$/i);
                if (match) {
                    seccionActual = match[1].trim();
                    campoActual = '';
                    return;
                }

                match = linea.match(/^\[PREGUNTA\s*(\d*)\]\s*(.*)$/i);
                if (match) {
                    cerrarActual();
                    actual = crearProblemaVacio(match[1].trim(), seccionActual);
                    if (match[2].trim()) actual.titulo = match[2].trim();
                    campoActual = '';
                    return;
                }

                if (!actual) return;

                match = linea.match(/^\[TITULO\]\s*(.*)$/i);
                if (match) {
                    actual.titulo = match[1].trim() || actual.titulo;
                    campoActual = 'titulo';
                    return;
                }

                match = linea.match(/^\[ENUNCIADO\]\s*(.*)$/i);
                if (match) {
                    actual.enunciado = match[1].trim();
                    campoActual = 'enunciado';
                    return;
                }

                match = linea.match(/^\[([A-DVF])\]\s*(.*)$/i);
                if (match) {
                    letraActual = match[1].toUpperCase();
                    actual.opciones.push({ letra: letraActual, texto: match[2].trim() });
                    campoActual = 'opcion';
                    return;
                }

                match = linea.match(/^\[CORRECTA\]\s*([A-DVF])\b/i);
                if (match) {
                    actual.correcta = match[1].toUpperCase();
                    campoActual = '';
                    return;
                }

                if (campoActual === 'enunciado') {
                    actual.enunciado += (actual.enunciado ? ' ' : '') + linea;
                } else if (campoActual === 'opcion' && letraActual) {
                    const ultima = actual.opciones[actual.opciones.length - 1];
                    if (ultima) ultima.texto += ' ' + linea;
                } else if (campoActual === 'titulo') {
                    actual.titulo += ' ' + linea;
                }
            });

            cerrarActual();
            return lista;
        }

        function parsearSolucionario(textoSolucionario) {
            const mapa = {};
            const lineas = normalizarSaltos(textoSolucionario).split('\n');

            lineas.forEach(lineaOriginal => {
                const linea = lineaOriginal.trim();
                if (!linea) return;
                if (/^Parte\s+/i.test(linea)) return;

                // Acepta: 1 B / 1: B / 1) B / 1. B / 1 - B / 2 V / 7 F
                const match = linea.match(/^(\d+)\s*(?::|\)|\.|-|\s)\s*([A-DVF])\b/i);
                if (match) {
                    mapa[match[1]] = match[2].toUpperCase();
                }
            });

            return mapa;
        }

        function separarCuerpoYSolucionario(texto) {
            const limpio = normalizarSaltos(texto);
            const match = limpio.match(/(?:^|\n)\s*(SOLUCIONARIO(?:\s+DOCENTE)?|RESPUESTAS(?:\s+CORRECTAS?)?)\s*(?:\n|$)/i);
            if (!match) return null;

            return {
                cuerpo: limpio.slice(0, match.index),
                solucionario: limpio.slice(match.index + match[0].length)
            };
        }

        function detectarTituloActividad(texto) {
            const porEtiqueta = extraerEtiquetaGlobal(texto, 'ACTIVIDAD');
            if (porEtiqueta) return porEtiqueta;

            const lineas = normalizarSaltos(texto).split('\n').map(l => l.trim()).filter(Boolean);
            if (!lineas.length) return '';

            const primera = lineas[0];
            let match = primera.match(/^Actividad\s+de\s+lectura\s*:\s*(.+)$/i);
            if (match) return match[1].trim();

            match = primera.match(/^Actividad\s*:\s*(.+)$/i);
            if (match) return match[1].trim();

            return '';
        }

        function parsearFormatoConSolucionario(texto) {
            const separado = separarCuerpoYSolucionario(texto);
            if (!separado) return [];

            const cuerpo = separado.cuerpo;
            const solucionario = separado.solucionario;
            const correctas = parsearSolucionario(solucionario);
            const lineas = cuerpo.split('\n');
            const lista = [];
            let seccionActual = '';
            let actual = null;
            let leyendo = '';

            function cerrarActual() {
                if (!actual) return;
                actual.correcta = normalizarLetra(correctas[String(actual.numero)] || actual.correcta);
                actual.opciones = actual.opciones.filter(op => op && op.letra && op.texto.trim());
                if (problemaValido(actual)) lista.push(actual);
                actual = null;
                leyendo = '';
            }

            lineas.forEach(lineaOriginal => {
                const linea = lineaOriginal.trim();
                if (!linea) return;

                // Título general: Actividad de lectura: El hombre sin cabeza
                let match = linea.match(/^Actividad\s+de\s+lectura\s*:\s*(.+)$/i);
                if (match) {
                    tituloActividadDetectado = match[1].trim() || tituloActividadDetectado;
                    leyendo = '';
                    return;
                }

                match = linea.match(/^Actividad\s*:\s*(.+)$/i);
                if (match) {
                    tituloActividadDetectado = match[1].trim() || tituloActividadDetectado;
                    leyendo = '';
                    return;
                }

                // Encabezados de parte del formato anterior: 1. Preguntas de la Parte I (Capítulo I)
                match = linea.match(/^\d+\.\s*Preguntas\s+de\s+la\s+Parte\s+([^\(]+)\s*\((.+)\)\s*$/i);
                if (match) {
                    cerrarActual();
                    seccionActual = 'Parte ' + match[1].trim() + ': ' + match[2].trim();
                    leyendo = '';
                    return;
                }

                match = linea.match(/^\d+\.\s*Preguntas\s+de\s+(.+?)\s*\((.+)\)\s*$/i);
                if (match) {
                    cerrarActual();
                    seccionActual = match[1].trim() + ': ' + match[2].trim();
                    leyendo = '';
                    return;
                }

                // Preguntas: 1. texto o 1) texto
                match = linea.match(/^(\d+)[\.)]\s+(.+)$/);
                if (match) {
                    cerrarActual();
                    actual = crearProblemaVacio(match[1], seccionActual);
                    actual.enunciado = match[2].trim();
                    actual.correcta = correctas[String(actual.numero)] || '';
                    leyendo = 'enunciado';
                    return;
                }

                if (!actual) return;

                // Opciones: [ ] A) texto / [ ] V) Verdadero. / [ ] F) Falso.
                match = linea.match(/^\[\s*\]\s*([A-DVF])\)\s*(.+)$/i);
                if (match) {
                    actual.opciones.push({ letra: match[1].toUpperCase(), texto: match[2].trim() });
                    leyendo = 'opcion';
                    return;
                }

                if (leyendo === 'opcion' && actual.opciones.length) {
                    actual.opciones[actual.opciones.length - 1].texto += ' ' + linea;
                } else if (leyendo === 'enunciado') {
                    actual.enunciado += ' ' + linea;
                }
            });

            cerrarActual();
            return lista;
        }

        function armarProblemasDesdeTexto(texto) {
            tituloActividadDetectado = detectarTituloActividad(texto);
            let lista = [];

            if (/\[PREGUNTA\s*\d*\]/i.test(texto)) {
                lista = parsearFormatoEtiquetado(texto);
                ultimoFormatoDetectado = 'formato etiquetado';
            }

            if (!lista.length && /(SOLUCIONARIO|RESPUESTAS\s+CORRECTAS?)/i.test(texto)) {
                lista = parsearFormatoConSolucionario(texto);
                ultimoFormatoDetectado = 'formato con solucionario separado';
            }

            return lista;
        }

        function procesarTexto() {
            const input = document.getElementById('texto-input');
            const texto = input ? input.value : '';
            if (!texto.trim()) {
                informarEstado('Pegá las preguntas antes de generar.', false);
                return;
            }

            clearTimeout(temporizadorAvance);
            try { localStorage.setItem(CLAVE_INPUT, texto); } catch(e) {}

            problemas = armarProblemasDesdeTexto(texto);
            respuestas = [];
            indiceActual = 0;
            opcionSeleccionada = null;
            try { localStorage.removeItem(claveProgreso()); } catch(e) {}

            const zonaActividad = document.getElementById('zona-actividad');
            if (zonaActividad) zonaActividad.style.display = problemas.length ? 'block' : 'none';

            const tituloExport = document.getElementById('titulo-export');
            if (tituloExport && tituloActividadDetectado && tituloExport.value === 'Actividad de Lengua') {
                tituloExport.value = tituloActividadDetectado;
            }

            if (problemas.length) {
                informarEstado('Se generaron ' + problemas.length + ' preguntas. Formato detectado: ' + ultimoFormatoDetectado + '.', true);
            } else {
                informarEstado('No se pudieron detectar preguntas válidas. Revisá que cada pregunta tenga opciones A-D o V-F y respuesta correcta.', false);
            }

            renderizarTarjetaActual();
            guardarEstado();
        }

        function renderizarTarjetaActual() {
            clearTimeout(temporizadorAvance);
            opcionSeleccionada = null;

            const contenedor = document.getElementById('bateria-container');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            if (!problemas.length) {
                actualizarMiniResumen();
                return;
            }

            if (indiceActual >= problemas.length) {
                renderizarResumenFinal();
                actualizarMiniResumen();
                return;
            }

            const problema = problemas[indiceActual];
            const respuesta = respuestas[indiceActual] || null;
            const estaBloqueada = !!respuesta;

            let opcionesHTML = '';
            problema.opciones.forEach((opcion, idx) => {
                const seleccionada = respuesta ? respuesta.opcion === opcion.letra : false;
                const esCorrectaDelProblema = opcion.letra === problema.correcta;
                let clases = 'opcion-btn';

                if (seleccionada) clases += ' selected';
                if (estaBloqueada) clases += ' bloqueada';
                if (respuesta && seleccionada && respuesta.esCorrecta) clases += ' respuesta-correcta';
                if (respuesta && seleccionada && !respuesta.esCorrecta) clases += ' respuesta-incorrecta';
                if (respuesta && !respuesta.esCorrecta && esCorrectaDelProblema) clases += ' respuesta-correcta';

                opcionesHTML += '<div class="' + clases + '" data-letra="' + escaparHTML(opcion.letra) + '" onclick="seleccionarOpcion(' + idx + ')">' +
                    '<span class="opcion-letra">' + escaparHTML(opcion.letra) + '</span>' +
                    '<span class="opcion-texto">' + escaparHTML(opcion.texto) + '</span>' +
                '</div>';
            });

            let feedbackHTML = '';
            let feedbackColor = '';

            if (respuesta) {
                if (respuesta.esCorrecta) {
                    feedbackHTML = '✅ ¡Correcto!';
                    feedbackColor = '#27ae60';
                } else {
                    feedbackHTML = '❌ Incorrecto. La correcta está marcada en verde.';
                    feedbackColor = '#c62828';
                }
            }

            const textoSiguiente = indiceActual >= problemas.length - 1 ? 'Finalizar' : 'Siguiente';
            const disabledAnterior = indiceActual <= 0 ? 'disabled' : '';
            const disabledSiguiente = respuesta ? '' : 'disabled';
            const seccionHTML = problema.seccion ? '<div class="seccion-chip">' + escaparHTML(problema.seccion) + '</div>' : '';

            const botonesHTML =
                '<div class="navegacion-tarjeta">' +
                    '<button class="btn-nav" onclick="irTarjetaAnterior()" ' + disabledAnterior + '>Anterior</button>' +
                    '<button class="btn-nav" id="btn-siguiente" onclick="avanzarTarjeta()" ' + disabledSiguiente + '>' + textoSiguiente + '</button>' +
                '</div>';

            contenedor.innerHTML =
                '<div class="problema-card">' +
                    '<div class="avance-ficha">Pregunta ' + (indiceActual + 1) + ' de ' + problemas.length + '</div>' +
                    seccionHTML +
                    '<div class="encabezado-tarjeta">' +
                        '<h2 class="titulo-problema">' + escaparHTML(problema.titulo || ('Pregunta ' + problema.numero)) + '</h2>' +
                        '<img class="img-titulo-card" src="' + obtenerRutaImagenTitulo() + '" alt="" aria-hidden="true" onerror="resolverImagenTitulo(this)">' +
                    '</div>' +
                    '<p class="enunciado">' + escaparHTML(problema.enunciado) + '</p>' +
                    '<div class="opciones-grid">' + opcionesHTML + '</div>' +
                    '<div class="feedback-msg" id="feedback-msg" style="color:' + feedbackColor + ';">' + feedbackHTML + '</div>' +
                    '<div id="zona-boton-accion">' + botonesHTML + '</div>' +
                '</div>';

            actualizarMiniResumen();
        }

        function seleccionarOpcion(indiceOpcion) {
            const problema = problemas[indiceActual];
            if (!problema || respuestas[indiceActual]) return;

            const botones = document.querySelectorAll('.opcion-btn');
            botones.forEach(btn => btn.classList.remove('selected'));

            const btn = botones[indiceOpcion];
            if (!btn) return;

            btn.classList.add('selected');
            opcionSeleccionada = btn.getAttribute('data-letra');

            const esCorrecta = opcionSeleccionada === problema.correcta;

            respuestas[indiceActual] = {
                opcion: opcionSeleccionada,
                esCorrecta: esCorrecta
            };

            guardarEstado();
            bloquearOpciones(esCorrecta);
            actualizarMiniResumen();

            const feedback = document.getElementById('feedback-msg');
            if (feedback) {
                if (esCorrecta) {
                    feedback.innerHTML = '✅ ¡Correcto!';
                    feedback.style.color = '#27ae60';
                } else {
                    feedback.innerHTML = '❌ Incorrecto. La correcta está marcada en verde.';
                    feedback.style.color = '#c62828';
                }
            }

            const btnSiguiente = document.getElementById('btn-siguiente');
            if (btnSiguiente) btnSiguiente.disabled = false;
        }

        function verificarRespuesta() {
            // Se conserva solo por compatibilidad con actividades viejas.
            // En esta versión, la respuesta se valida automáticamente al tocar una opción.
            return;
        }

        function bloquearOpciones(esCorrecta) {
            const problema = problemas[indiceActual];
            const botones = document.querySelectorAll('.opcion-btn');

            botones.forEach(btn => {
                const letra = btn.getAttribute('data-letra');
                btn.classList.add('bloqueada');

                if (letra === opcionSeleccionada) {
                    btn.classList.add(esCorrecta ? 'respuesta-correcta' : 'respuesta-incorrecta');
                }

                if (!esCorrecta && letra === problema.correcta) {
                    btn.classList.add('respuesta-correcta');
                }
            });
        }

        function avanzarTarjeta() {
            clearTimeout(temporizadorAvance);
            if (indiceActual < problemas.length) indiceActual++;
            guardarEstado();
            renderizarTarjetaActual();
        }

        function irTarjetaAnterior() {
            clearTimeout(temporizadorAvance);
            if (indiceActual > 0) indiceActual--;
            guardarEstado();
            renderizarTarjetaActual();
        }

        function obtenerResumenResultados() {
            const total = problemas.length;
            const respondidas = respuestas.filter(Boolean).length;
            const correctas = respuestas.filter(r => r && r.esCorrecta).length;
            const incorrectas = respuestas.filter(r => r && !r.esCorrecta).length;
            const porcentaje = total ? Math.round((correctas / total) * 1000) / 10 : 0;
            return { total: total, respondidas: respondidas, correctas: correctas, incorrectas: incorrectas, porcentaje: porcentaje };
        }

        function informeFinalHabilitado() {
            const check = document.getElementById('activar-informe-final');
            if (check && !modoExportado) return check.checked;
            return informeFinalActivo;
        }

        function buscarOpcionPorLetra(problema, letra) {
            if (!problema || !Array.isArray(problema.opciones)) return null;
            return problema.opciones.find(op => op.letra === letra) || null;
        }

        function textoRespuesta(problema, letra) {
            if (!letra) return 'Sin responder';
            const op = buscarOpcionPorLetra(problema, letra);
            return op ? (op.letra + ') ' + op.texto) : letra;
        }

        function generarDetalleResultadosHTML() {
            let salida = '';
            problemas.forEach((problema, idx) => {
                const respuesta = respuestas[idx] || null;
                const esCorrecta = !!(respuesta && respuesta.esCorrecta);
                const clase = esCorrecta ? 'correcta' : 'incorrecta';
                const estado = esCorrecta ? 'Correcta' : 'Incorrecta';
                salida += '<div class="detalle-item ' + clase + '">' +
                    '<p><strong>' + (idx + 1) + '. ' + escaparHTML(problema.enunciado) + '</strong></p>' +
                    '<p><strong>Tu respuesta:</strong> ' + escaparHTML(textoRespuesta(problema, respuesta ? respuesta.opcion : '')) + '</p>' +
                    '<p><strong>Respuesta correcta:</strong> ' + escaparHTML(textoRespuesta(problema, problema.correcta)) + '</p>' +
                    '<p><strong>Estado:</strong> ' + estado + '</p>' +
                '</div>';
            });
            return salida;
        }

        function alternarDetalleResultados() {
            const detalle = document.getElementById('detalle-resultados');
            if (!detalle) return;
            detalle.style.display = detalle.style.display === 'block' ? 'none' : 'block';
        }

        function obtenerTituloActividadActual() {
            const tituloExport = document.getElementById('titulo-export');
            const h1 = document.querySelector('header.docente-header h1');
            return tituloActividadDetectado || (tituloExport && tituloExport.value.trim()) || (h1 && h1.textContent.trim()) || document.title || 'Actividad de Lengua';

        function obtenerNombreAlumnoInforme() {
            const input = document.getElementById('nombre-alumno-informe');
            const nombre = input ? input.value.trim() : '';
            return nombre || 'Sin nombre';
        }

        function generarHTMLCorreccion(alumno) {
            const titulo = obtenerTituloActividadActual();
            const resumen = obtenerResumenResultados();
            const fecha = new Date().toLocaleString('es-AR');
            const paleta = obtenerPaletaActual();
            let detalle = '';

            problemas.forEach((problema, idx) => {
                const respuesta = respuestas[idx] || null;
                const esCorrecta = !!(respuesta && respuesta.esCorrecta);
                const clase = esCorrecta ? 'correcta' : 'incorrecta';
                const estado = esCorrecta ? 'Correcta' : 'Incorrecta';

(function() {
  const btn = document.getElementById("btn-volver-origen");
  if (!btn) return;

  const fallbackHref = btn.dataset.fallbackHref || btn.getAttribute("href") || "index.html";
  const fallbackLabel = btn.dataset.fallbackLabel || "Autoevaluaciones";

  function usarFallback() {
    btn.href = fallbackHref;
    btn.textContent = "⬅ Volver a " + fallbackLabel;
  }

  function limpiarTitulo(titulo) {
    titulo = String(titulo || "").replace(/\s+/g, " ").trim();
    return titulo || fallbackLabel;
  }

  const anterior = document.referrer;
  if (!anterior) {
    usarFallback();
    return;
  }

  let urlAnterior;
  let urlActual;

  try {
    urlAnterior = new URL(anterior);
    urlActual = new URL(window.location.href);
  } catch(e) {
    usarFallback();
    return;
  }

  if (urlAnterior.origin !== urlActual.origin || urlAnterior.href === urlActual.href) {
    usarFallback();
    return;
  }

  btn.href = urlAnterior.pathname + urlAnterior.search + urlAnterior.hash;

  fetch(urlAnterior.href, { credentials: "same-origin" })
    .then(response => {
      if (!response.ok) throw new Error("No se pudo leer la página anterior");
      return response.text();
    })
    .then(html => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const titleNode = doc.querySelector("title");
      const titulo = limpiarTitulo(titleNode ? titleNode.textContent : "");
      btn.textContent = "⬅ Volver a " + titulo;
    })
    .catch(() => {
      btn.textContent = "⬅ Volver a " + fallbackLabel;
    });
})();
